<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3b73">
<link rel="manifest" href="manifest.webmanifest">
<title>返済と家計簿</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6d7688;--line:#e5e9f0;--p:#1f3b73;--a:#4766d8;--good:#0f9d6c;--bad:#d94a4a;--soft:#eef3ff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',system-ui,sans-serif}body{padding-bottom:92px}button,input,select{font:inherit}.app{max-width:920px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}.top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 28px rgba(25,36,60,.06)}.kpi{grid-column:span 6}.span12{grid-column:span 12}.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:23px;font-weight:900;margin-top:6px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800;color:var(--text)}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.btn.danger{color:var(--bad)}.btn.small{padding:7px 10px;font-size:12px}.page{display:none}.page.active{display:block}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(14px)}.nav{border:0;background:transparent;border-radius:12px;padding:10px 3px;color:var(--muted);font-weight:800;font-size:12px}.nav.active{background:var(--soft);color:var(--p)}h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-height:44px}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:14px;padding:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tiny{font-size:12px}.muted{color:var(--muted)}.chip{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--p);font-size:11px;font-weight:900}.progress{height:10px;background:#edf0f5;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--p),var(--a))}.money{font-variant-numeric:tabular-nums}.good{color:var(--good)}.bad{color:var(--bad)}hr{border:0;border-top:1px solid var(--line);margin:12px 0}.empty{text-align:center;color:var(--muted);padding:20px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.edit-banner{display:none;background:#fff6dd;border:1px solid #f0d48b;border-radius:12px;padding:9px 11px;font-size:12px;margin-bottom:10px}.edit-banner.show{display:block}.notice{font-size:12px;color:var(--muted);padding:10px 12px;background:#f7f9fc;border-radius:12px;margin-top:10px}@media(min-width:700px){.kpi{grid-column:span 3}.half{grid-column:span 6}.app{padding:24px}.bottom{left:50%;transform:translateX(-50%);max-width:920px;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
</style>
</head><body>
<div class="app">
<div class="top"><div><h1>返済と家計簿</h1><div class="sub">任意整理の返済・生活費・収入支出をスマホで管理</div></div><div class="top-actions"><button id="installBtn" class="btn small" style="display:none">ホーム追加</button><button class="btn small" onclick="backup()">バックアップ</button><label class="btn small">復元<input id="restoreFile" type="file" accept=".json" hidden></label></div></div>
<section id="home" class="page active"><div class="grid"><div class="card kpi"><div class="l">今月の収入</div><div class="v money" id="kIncome">¥0</div></div><div class="card kpi"><div class="l">今月の借金返済</div><div class="v money" id="kDebtPay">¥0</div></div><div class="card kpi"><div class="l">今月の生活費</div><div class="v money" id="kLiving">¥0</div></div><div class="card kpi"><div class="l">今月の収支</div><div class="v money" id="kBalance">¥0</div></div><div class="card span12"><div class="row"><div><div class="tiny muted">借金総残高</div><div class="v money" style="font-size:28px;font-weight:900" id="kDebtTotal">¥0</div></div><span class="chip" id="debtCount">0社</span></div></div><div class="card span12 half"><h2>返済状況</h2><div id="homeDebts" class="list"></div></div><div class="card span12 half"><h2>生活費予算</h2><div id="homeLiving" class="list"></div></div><div class="card span12"><div class="notice">データはこの端末のブラウザ内に自動保存されます。通信がなくても入力できます。機種変更・ブラウザデータ削除に備えて、定期的にバックアップしてください。</div></div></div></section>
<section id="ledger" class="page"><div class="grid"><div class="card span12"><h2>家計簿を入力</h2><div id="entryEditBanner" class="edit-banner">編集中です。保存すると元の記録が更新されます。</div><form id="ledgerForm" class="form"><div class="field"><label>日付</label><input id="entryDate" type="date" required></div><div class="field"><label>区分</label><select id="entryType"><option>借金返済</option><option>生活費</option><option>収入</option><option>その他支出</option></select></div><div class="field full" id="creditorWrap"><label>債権者</label><select id="entryCreditor"></select></div><div class="field full" id="livingWrap" style="display:none"><label>生活費項目</label><select id="entryLiving"></select></div><div class="field"><label>金額</label><input id="entryAmount" type="number" min="0" required></div><div class="field" id="feeWrap"><label>手数料</label><input id="entryFee" type="number" min="0" value="0"></div><div class="field full"><label>メモ</label><input id="entryMemo"></div><button id="entrySubmit" class="btn primary full">記録する</button><button id="entryCancel" type="button" class="btn full" style="display:none" onclick="cancelEntryEdit()">編集をキャンセル</button></form></div><div class="card span12"><div class="row"><h2>最近の記録</h2><button class="btn small" onclick="exportCSV()">CSV</button></div><div id="ledgerList" class="list"></div></div></div></section>
<section id="debts" class="page"><div class="grid"><div class="card span12"><h2>債権者</h2><div id="debtEditBanner" class="edit-banner">債権者情報を編集中です。</div><form id="debtForm" class="form"><div class="field full"><label>債権者</label><input id="debtName" required></div><div class="field"><label>残債</label><input id="debtBalance" type="number" min="0" required></div><div class="field"><label>毎月返済額</label><input id="debtMonthly" type="number" min="0" value="0"></div><div class="field"><label>手数料</label><input id="debtFee" type="number" min="0" value="0"></div><div class="field"><label>状態</label><select id="debtStatus"><option>返済中</option><option>完済</option></select></div><button id="debtSubmit" class="btn primary full">追加</button><button id="debtCancel" type="button" class="btn full" style="display:none" onclick="cancelDebtEdit()">編集をキャンセル</button></form></div><div class="card span12"><h2>借金一覧</h2><div id="debtList" class="list"></div></div></div></section>
<section id="living" class="page"><div class="grid"><div class="card span12"><h2>生活費項目</h2><div id="livingEditBanner" class="edit-banner">生活費項目を編集中です。</div><form id="livingForm" class="form"><div class="field full"><label>項目名</label><input id="livingName" placeholder="例：ガソリン" required></div><div class="field"><label>月予算</label><input id="livingBudget" type="number" min="0" value="0"></div><div class="field"><label>カテゴリ</label><select id="livingCategory"><option>食費</option><option>交通</option><option>保険</option><option>健康</option><option>通信</option><option>日用品</option><option>その他</option></select></div><button id="livingSubmit" class="btn primary full">追加</button><button id="livingCancel" type="button" class="btn full" style="display:none" onclick="cancelLivingEdit()">編集をキャンセル</button></form></div><div class="card span12"><h2>生活費一覧</h2><div id="livingList" class="list"></div></div></div></section>
</div>
<nav class="bottom"><button class="nav active" data-page="home">ホーム</button><button class="nav" data-page="ledger">家計簿</button><button class="nav" data-page="debts">借金返済</button><button class="nav" data-page="living">生活費</button></nav>
<script>
const initial={debts:[['ソフトバンク(完済)',0,167932,0,0,'完済'],['アプラス',1043275,1043275,0,0,'返済中'],['PayPay',42966,42966,5000,145,'返済中'],['NTT',140000,140000,3500,145,'返済中'],['KDDI',289989,289989,4800,145,'返済中'],['TBC',430477,430477,5100,145,'返済中'],['セゾン',587101,587101,9800,145,'返済中'],['SMBC',586765,586765,10000,145,'返済中'],['三井住友',684028,684028,8100,145,'返済中'],['イオン',885087,885087,14800,145,'返済中'],['アコム',960159,960159,18700,145,'返済中'],['JCB',1061746,1061746,15500,145,'返済中']].map((x,i)=>({id:'d'+i,name:x[0],balance:x[1],initial:x[2],monthly:x[3],fee:x[4],status:x[5]})),living:[['ガソリン',5000,'交通'],['スミセイ',7242,'保険'],['エニタイム',7480,'健康'],['ジブラルタ',2215,'保険'],['久保医院',4000,'健康'],['道場',1500,'健康'],['Re:works',19333,'その他'],['Re:works 2',4980,'その他']].map((x,i)=>({id:'l'+i,name:x[0],budget:x[1],category:x[2]})),entries:[]};
let state=load(),editingEntry=null,editingDebt=null,editingLiving=null,deferredPrompt=null;
function load(){try{return JSON.parse(localStorage.getItem('kakeibo_web_v3'))||structuredClone(initial)}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem('kakeibo_web_v3',JSON.stringify(state));render()}
const yen=n=>'¥'+Math.round(Number(n||0)).toLocaleString('ja-JP'),today=()=>new Date().toISOString().slice(0,10),ym=d=>String(d).slice(0,7),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random();entryDate.value=today();
function showPage(id){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));scrollTo(0,0)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showPage(b.dataset.page));entryType.onchange=toggle;
function toggle(){let t=entryType.value;creditorWrap.style.display=t==='借金返済'?'block':'none';livingWrap.style.display=t==='生活費'?'block':'none';feeWrap.style.display=t==='借金返済'?'block':'none'}
function selects(){entryCreditor.innerHTML=state.debts.filter(d=>d.balance>0||d.id===state.entries.find(e=>e.id===editingEntry)?.creditorId).map(d=>`<option value='${d.id}'>${esc(d.name)}（残 ${yen(d.balance)}）</option>`).join('');entryLiving.innerHTML=state.living.map(x=>`<option value='${x.id}'>${esc(x.name)}</option>`).join('')}
function reverseDebtEffect(r){if(r&&r.type==='借金返済'&&r.creditorId){let d=state.debts.find(x=>x.id===r.creditorId);if(d){d.balance=Math.min(d.initial,d.balance+Math.max(0,r.amount-(r.fee||0)));if(d.balance>0)d.status='返済中'}}}
function applyDebtEffect(r){if(r.type==='借金返済'){let d=state.debts.find(x=>x.id===r.creditorId);if(!d)return false;d.balance=Math.max(0,d.balance-Math.max(0,r.amount-(r.fee||0)));if(d.balance===0)d.status='完済'}return true}
ledgerForm.onsubmit=e=>{e.preventDefault();let t=entryType.value,a=+entryAmount.value,f=+entryFee.value||0,r={id:editingEntry||uid(),date:entryDate.value,type:t,amount:a,fee:f,memo:entryMemo.value.trim(),creditorId:null,livingId:null};if(t==='借金返済')r.creditorId=entryCreditor.value;if(t==='生活費')r.livingId=entryLiving.value;if(editingEntry){let old=state.entries.find(x=>x.id===editingEntry);reverseDebtEffect(old);state.entries=state.entries.filter(x=>x.id!==editingEntry)}if(!applyDebtEffect(r)){alert('債権者を選んでください');return}state.entries.unshift(r);cancelEntryEdit(false);save()};
function editEntry(id){let r=state.entries.find(x=>x.id===id);if(!r)return;editingEntry=id;entryDate.value=r.date;entryType.value=r.type;selects();toggle();if(r.creditorId)entryCreditor.value=r.creditorId;if(r.livingId)entryLiving.value=r.livingId;entryAmount.value=r.amount;entryFee.value=r.fee||0;entryMemo.value=r.memo||'';entrySubmit.textContent='変更を保存';entryCancel.style.display='block';entryEditBanner.classList.add('show');showPage('ledger');}
function cancelEntryEdit(clear=true){editingEntry=null;entrySubmit.textContent='記録する';entryCancel.style.display='none';entryEditBanner.classList.remove('show');if(clear){ledgerForm.reset();entryDate.value=today();entryFee.value=0;entryType.value='借金返済';toggle();selects()}else{entryAmount.value='';entryFee.value='0';entryMemo.value='';entryDate.value=today()}}
function delEntry(id){let r=state.entries.find(x=>x.id===id);if(!r||!confirm('削除しますか？'))return;reverseDebtEffect(r);state.entries=state.entries.filter(x=>x.id!==id);save()}
debtForm.onsubmit=e=>{e.preventDefault();if(editingDebt){let d=state.debts.find(x=>x.id===editingDebt);if(d){d.name=debtName.value.trim();d.balance=+debtBalance.value;d.initial=Math.max(d.initial,d.balance);d.monthly=+debtMonthly.value||0;d.fee=+debtFee.value||0;d.status=debtStatus.value}}else state.debts.push({id:uid(),name:debtName.value.trim(),balance:+debtBalance.value,initial:+debtBalance.value,monthly:+debtMonthly.value||0,fee:+debtFee.value||0,status:debtStatus.value});cancelDebtEdit();save()};
function editDebt(id){let d=state.debts.find(x=>x.id===id);if(!d)return;editingDebt=id;debtName.value=d.name;debtBalance.value=d.balance;debtMonthly.value=d.monthly;debtFee.value=d.fee;debtStatus.value=d.status;debtSubmit.textContent='変更を保存';debtCancel.style.display='block';debtEditBanner.classList.add('show');showPage('debts')}
function cancelDebtEdit(){editingDebt=null;debtForm.reset();debtMonthly.value=0;debtFee.value=0;debtSubmit.textContent='追加';debtCancel.style.display='none';debtEditBanner.classList.remove('show')}
function delDebt(id){if(confirm('削除しますか？')){state.debts=state.debts.filter(x=>x.id!==id);save()}}
livingForm.onsubmit=e=>{e.preventDefault();if(editingLiving){let x=state.living.find(v=>v.id===editingLiving);if(x){x.name=livingName.value.trim();x.budget=+livingBudget.value||0;x.category=livingCategory.value}}else state.living.push({id:uid(),name:livingName.value.trim(),budget:+livingBudget.value||0,category:livingCategory.value});cancelLivingEdit();save()};
function editLiving(id){let x=state.living.find(v=>v.id===id);if(!x)return;editingLiving=id;livingName.value=x.name;livingBudget.value=x.budget;livingCategory.value=x.category;livingSubmit.textContent='変更を保存';livingCancel.style.display='block';livingEditBanner.classList.add('show');showPage('living')}
function cancelLivingEdit(){editingLiving=null;livingForm.reset();livingBudget.value=0;livingSubmit.textContent='追加';livingCancel.style.display='none';livingEditBanner.classList.remove('show')}
function delLiving(id){if(confirm('削除しますか？')){state.living=state.living.filter(x=>x.id!==id);save()}}
function home(){let m=today().slice(0,7),r=state.entries.filter(x=>ym(x.date)===m),inc=r.filter(x=>x.type==='収入').reduce((a,b)=>a+b.amount,0),dp=r.filter(x=>x.type==='借金返済').reduce((a,b)=>a+b.amount,0),lv=r.filter(x=>x.type==='生活費').reduce((a,b)=>a+b.amount,0),ot=r.filter(x=>x.type==='その他支出').reduce((a,b)=>a+b.amount,0),bal=inc-dp-lv-ot;kIncome.textContent=yen(inc);kDebtPay.textContent=yen(dp);kLiving.textContent=yen(lv);kBalance.textContent=yen(bal);kBalance.className='v money '+(bal<0?'bad':'good');kDebtTotal.textContent=yen(state.debts.reduce((a,b)=>a+b.balance,0));debtCount.textContent=state.debts.filter(d=>d.balance>0).length+'社';homeDebts.innerHTML=state.debts.filter(d=>d.balance>0).slice(0,6).map(d=>{let p=d.initial?Math.min(100,(d.initial-d.balance)/d.initial*100):100;return `<div class='item'><div class='row'><strong>${esc(d.name)}</strong><strong>${yen(d.balance)}</strong></div><div class='tiny muted' style='margin:6px 0'>月 ${yen(d.monthly)} / 手数料 ${yen(d.fee)}</div><div class='progress'><div class='bar' style='width:${p}%'></div></div></div>`}).join('')||'<div class=empty>返済中なし</div>';let sums={};r.filter(x=>x.type==='生活費').forEach(x=>sums[x.livingId]=(sums[x.livingId]||0)+x.amount);homeLiving.innerHTML=state.living.map(x=>{let u=sums[x.id]||0,rem=x.budget-u,p=x.budget?Math.min(100,u/x.budget*100):0;return `<div class='item'><div class='row'><strong>${esc(x.name)}</strong><strong class='${rem<0?'bad':'good'}'>${rem<0?'超過 ':'残り '}${yen(Math.abs(rem))}</strong></div><div class='tiny muted' style='margin:6px 0'>${yen(u)} / ${yen(x.budget)}</div><div class='progress'><div class='bar' style='width:${p}%'></div></div></div>`}).join('')}
function ledger(){ledgerList.innerHTML=state.entries.slice(0,50).map(r=>{let d=state.debts.find(x=>x.id===r.creditorId),l=state.living.find(x=>x.id===r.livingId),detail=d?.name||l?.name||r.memo||'';return `<div class='item'><div class='row'><div><span class='chip'>${r.type}</span><div class='tiny muted' style='margin-top:6px'>${r.date} ${esc(detail)}</div></div><strong>${yen(r.amount)}</strong></div>${r.fee?`<div class='tiny muted'>手数料 ${yen(r.fee)}</div>`:''}<div class='actions'><button class='btn small' onclick="editEntry('${r.id}')">編集</button><button class='btn small danger' onclick="delEntry('${r.id}')">削除</button></div></div>`}).join('')||'<div class=empty>記録なし</div>'}
function debts(){debtList.innerHTML=state.debts.map(d=>{let paid=Math.max(0,d.initial-d.balance),months=d.monthly>d.fee?Math.ceil(d.balance/(d.monthly-d.fee)):'-';return `<div class='item'><div class='row'><div><h3>${esc(d.name)}</h3><div class='tiny muted'>${d.status}</div></div><strong>${yen(d.balance)}</strong></div><hr><div class='row tiny'><span>毎月返済</span><strong>${yen(d.monthly)}</strong></div><div class='row tiny'><span>手数料</span><strong>${yen(d.fee)}</strong></div><div class='row tiny'><span>返済済み</span><strong>${yen(paid)}</strong></div><div class='row tiny'><span>残り目安</span><strong>${months==='-'?'未設定':months+'回'}</strong></div><div class='actions'><button class='btn small' onclick="editDebt('${d.id}')">編集</button><button class='btn small danger' onclick="delDebt('${d.id}')">削除</button></div></div>`}).join('')}
function living(){let m=today().slice(0,7),s={};state.entries.filter(x=>x.type==='生活費'&&ym(x.date)===m).forEach(x=>s[x.livingId]=(s[x.livingId]||0)+x.amount);livingList.innerHTML=state.living.map(x=>{let u=s[x.id]||0,rem=x.budget-u;return `<div class='item'><div class='row'><div><h3>${esc(x.name)}</h3><div class='tiny muted'>${x.category}</div></div><strong>${yen(x.budget)}</strong></div><hr><div class='row tiny'><span>今月実績</span><strong>${yen(u)}</strong></div><div class='row tiny'><span>残額</span><strong class='${rem<0?'bad':'good'}'>${yen(rem)}</strong></div><div class='actions'><button class='btn small' onclick="editLiving('${x.id}')">編集</button><button class='btn small danger' onclick="delLiving('${x.id}')">削除</button></div></div>`}).join('')}
function render(){selects();toggle();home();ledger();debts();living()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dl(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){dl(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'返済と家計簿_バックアップ.json')}function exportCSV(){let rows=[['日付','区分','債権者','生活費項目','金額','手数料','メモ'],...state.entries.map(r=>[r.date,r.type,state.debts.find(x=>x.id===r.creditorId)?.name||'',state.living.find(x=>x.id===r.livingId)?.name||'',r.amount,r.fee||0,r.memo||''])],csv='\ufeff'+rows.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),'家計簿.csv')}
restoreFile.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.debts||!x.living||!x.entries)throw 0;if(confirm('現在のデータをバックアップ内容で置き換えますか？')){state=x;save();alert('復元しました')}}catch(_){alert('バックアップファイルを読み込めませんでした')}e.target.value=''};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block'});installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
